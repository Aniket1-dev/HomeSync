<!DOCTYPE html>
<html lang="en">
<head>
<style id="auth-gate">html{visibility:hidden}</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smitten — Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Caveat:wght@500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/studio.css">
<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/vendor/supabase.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/ui-helpers.js"></script>
<script src="assets/js/api.js"></script>
</head>
<body>
<script>AUTH.requireAuth();</script>
<svg style="position:absolute;width:0;height:0;"><defs>
  <symbol id="d-heart" viewBox="0 0 100 92"><path d="M50 88 C15 62 4 40 12 24 C19 10 40 8 50 24 C60 8 81 10 88 24 C96 40 85 62 50 88 Z"/></symbol>
</defs></svg>

<div class="topbar">
  <div class="topbar-l">
    <div class="brand"><svg viewBox="0 0 100 92" style="width:16px;height:16px;stroke:var(--pink);stroke-width:8;fill:none;"><use href="#d-heart"/></svg>Smitten</div>
    <input id="note-title-input" class="note-title" style="border:none;background:transparent;font:inherit;width:220px;" value="✏️ Untitled note">
  </div>
  <div class="topbar-r">
    <span id="save-indicator" style="font-size:11.5px;color:var(--ink-soft);align-self:center;margin-right:4px;"></span>
    <a href="dashboard.html" class="pill-btn ghost">Exit</a>
    <button class="pill-btn paper" id="btn-save-draft">Save draft</button>
    <a href="#" class="pill-btn paper" id="btn-preview">Preview</a>
    <button class="pill-btn pink" id="btn-publish">Publish →</button>
  </div>
</div>

<div class="studio">
  <div class="panel-left">
    <div class="panel-title">Sections</div>
    <div id="sections-list"></div>
    <div style="position:relative;">
      <button class="add-sec" id="btn-add-section">+ Add section</button>
      <div id="add-section-menu" style="display:none;position:absolute;bottom:44px;left:0;right:0;background:var(--card);border:2px solid var(--ink);border-radius:12px;box-shadow:4px 4px 0 var(--ink);z-index:20;max-height:240px;overflow:auto;"></div>
    </div>
  </div>

  <div class="panel-center">
    <div class="canvas" id="canvas"></div>
  </div>

  <div class="panel-right">
    <div class="panel-title" style="padding:0 0 14px;">Recipient</div>
    <div class="field"><label>Name</label><input type="text" id="recipient-name" placeholder="Who's this for?"></div>
    <div class="field"><label>Email <span class="opt">optional</span></label><input type="email" id="recipient-email" placeholder="their@email.com"></div>

    <div class="panel-title" style="padding:18px 0 14px;">Properties</div>
    <div class="prop-title" id="prop-title">Select a section</div>
    <div id="prop-fields"></div>
  </div>
</div>

<script src="assets/js/studio.js"></script>
</body>
</html>
