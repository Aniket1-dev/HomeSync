<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smitten — Turn a plan into a private little moment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Caveat:wght@500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/index.css">
<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/vendor/supabase.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/auth.js"></script>
</head>
<body>
<svg style="position:absolute;width:0;height:0;"><defs>
  <symbol id="d-heart" viewBox="0 0 100 92"><path d="M50 88 C15 62 4 40 12 24 C19 10 40 8 50 24 C60 8 81 10 88 24 C96 40 85 62 50 88 Z"/></symbol>
</defs></svg>
<div class="ambient"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<div class="brand"><svg viewBox="0 0 100 92" style="width:20px;height:20px;stroke:var(--pink);stroke-width:8;fill:none;"><use href="#d-heart"/></svg>Smitten</div>
<div class="wrap">
  <div class="hero">
    <div class="eyebrow">a private way to plan a date</div>
    <h1>Turn the plan into<br>a little <em>moment.</em></h1>
    <p>Write a note, pick the date and place, send a private link. They open it, they answer, you both get the plan.</p>
    <div class="heart-strip">
      <svg viewBox="0 0 100 92"><use href="#d-heart"/></svg>
      <svg viewBox="0 0 100 92"><use href="#d-heart"/></svg>
      <svg viewBox="0 0 100 92"><use href="#d-heart"/></svg>
    </div>
    <div class="cta-row" id="cta-row">
      <a href="signup.html" class="pill-btn pink sticker-shadow-sm">Get started →</a>
      <a href="login.html" class="pill-btn paper sticker-shadow-sm">I already have an account</a>
    </div>
  </div>
</div>
<footer class="site-foot">made with 💛 for someone special</footer>
<script>
(async function () {
  const session = await AUTH.getSession();
  if (session) {
    document.getElementById("cta-row").innerHTML =
      '<a href="dashboard.html" class="pill-btn pink sticker-shadow-sm">Go to my notes →</a>';
  }
})();
</script>
</body>
</html>
