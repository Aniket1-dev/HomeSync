<main>

  <header class="top">
    <h1>🕓 Audit log</h1>
    <div class="topright"><button class="pill-btn" id="export-btn"><svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M12 3v12M7 10l5 5 5-5M5 21h14" stroke="#3A2B39" stroke-width="2" stroke-linecap="round"/></svg> Export CSV</button><div class="avatar"></div></div>
  </header>
  <div class="panel">
    <div class="panel-head"><h3>Administrative activity</h3></div>
    <table>
      <thead><tr><th>Admin</th><th>Action</th><th>Target</th><th>Result</th><th>Timestamp</th></tr></thead>
      <tbody id="audit-tbody"><tr><td colspan="5" style="text-align:center;padding:36px;color:var(--ink-soft);">⏳ Loading…</td></tr></tbody>
    </table>
    <div class="panel-foot"><span id="audit-count"></span><div style="display:flex;gap:8px;"><button class="pill-btn" id="audit-prev">Prev</button><button class="pill-btn" id="audit-next">Next</button></div></div>
  </div>

</main>
<script>
const PAGE_SIZE = 25;
let page = 0;
let currentRows = [];

async function load() {
  const tbody = document.getElementById("audit-tbody");
  tbody.innerHTML = UI.loadingRow(5);
  try {
    const { rows, count } = await API.admin.listAuditLogs({ page, pageSize: PAGE_SIZE });
    currentRows = rows;
    if (!rows.length) { tbody.innerHTML = UI.emptyRow(5, "No admin activity yet."); }
    else {
      tbody.innerHTML = rows.map(r => `
        <tr>
          <td class="name">${UI.esc(r.admin_users?.users?.email || "—")}</td>
          <td>${UI.esc(r.action)}</td>
          <td>${UI.esc(r.target_type)} · ${UI.esc((r.target_id || "").slice(0, 8))}</td>
          <td><span class="tag ${r.result === "success" ? "active" : "suspended"}">${UI.esc(r.result)}</span></td>
          <td class="sub-text">${UI.fmtRelative(r.created_at)}</td>
        </tr>`).join("");
    }
    document.getElementById("audit-count").textContent = `Showing ${rows.length} of ${count} entries`;
    document.getElementById("audit-prev").disabled = page === 0;
    document.getElementById("audit-next").disabled = (page + 1) * PAGE_SIZE >= count;
  } catch (err) {
    tbody.innerHTML = UI.errorRow(5, UI.friendlyError(err));
  }
}
load();
document.getElementById("audit-prev").addEventListener("click", () => { if (page > 0) { page--; load(); } });
document.getElementById("audit-next").addEventListener("click", () => { page++; load(); });

document.getElementById("export-btn").addEventListener("click", () => {
  if (!currentRows.length) { UI.toast("Nothing to export on this page.", "error"); return; }
  const header = ["admin_email", "action", "target_type", "target_id", "result", "created_at"];
  const csv = [header.join(",")].concat(currentRows.map(r => [
    r.admin_users?.users?.email || "", r.action, r.target_type, r.target_id, r.result, r.created_at
  ].map(v => `"${String(v).replace(/"/g, '""')}"`).join(","))).join("\n");
  const blob = new Blob([csv], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `smitten-audit-log-page${page + 1}.csv`;
  a.click();
});
</script>
