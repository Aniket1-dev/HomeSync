<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roommate agreement — HomeSync AI</title><link rel="stylesheet" href="css/style.css"><style>.agreement-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.rule-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.rule{border:1px solid var(--line);border-radius:14px;padding:12px}.state{padding:14px;border-radius:14px;background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.24)}@media(max-width:760px){.agreement-grid,.rule-grid{grid-template-columns:1fr}}</style></head><body><nav class="nav"><div class="nav-inner"><div class="brand">HomeSync AI</div><div class="nav-links"><a href="chat.html">Chat</a><a href="trust-center.html">Trust Center</a></div></div></nav><main class="wrap section-tight"><a href="chat.html" class="muted">← Back to chat</a><section class="card" style="margin-top:18px"><span class="eyebrow">SHARED HOME PLAN</span><h1>Make the roommate agreement before the move.</h1><p class="muted">Put the money, move-in date and house rules in one shared record. This is not a legal lease; use the final landlord/lease documents for legal obligations.</p><div id="state" class="state">Loading…</div></section><section class="card" style="margin-top:18px"><div class="agreement-grid"><div><label>My monthly rent share</label><input id="rent" type="number" min="0"><label>My utilities share</label><input id="utilities" type="number" min="0"><label>My deposit share</label><input id="deposit" type="number" min="0"></div><div><label>Move-in date</label><input id="movein" type="date"><label>Agreement status</label><select id="status"><option value="draft">Draft</option><option value="proposed">Propose to roommate</option></select></div></div><h3 style="margin-top:24px">House rules</h3><div class="rule-grid"><label class="rule"><input type="checkbox" id="quiet"> Quiet hours agreed</label><label class="rule"><input type="checkbox" id="guests"> Guest rules agreed</label><label class="rule"><input type="checkbox" id="cleaning"> Cleaning schedule agreed</label><label class="rule"><input type="checkbox" id="food"> Food / kitchen rules agreed</label><label class="rule"><input type="checkbox" id="smoking"> Smoking rules agreed</label><label class="rule"><input type="checkbox" id="bills"> Bill payment date agreed</label></div><div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap"><button id="save" class="btn btn-primary">Save agreement</button><button id="accept" class="btn btn-ghost">✓ Accept this agreement</button></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="js/supabaseClient.js"></script><script src="js/roommate-agreement.js"></script></body></html>
