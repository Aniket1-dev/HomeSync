<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smitten — Create your account</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Caveat:wght@500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css">
<link rel="stylesheet" href="assets/css/auth-shared.css">
<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/vendor/supabase.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/auth.js"></script>
<style>
  body{ display:flex; align-items:center; justify-content:center; padding:40px 20px; }
  .card{ position:relative; z-index:2; background:var(--card); border:2.5px solid var(--ink); border-radius:22px; padding:40px 38px; width:100%; max-width:400px; box-shadow:5px 5px 0 var(--ink); }
  .brand{ display:flex; align-items:center; justify-content:center; gap:9px; font-family:'Fredoka'; font-weight:600; font-size:15px; margin-bottom:22px; }
  .card h1{ font-size:26px; text-align:center; margin-bottom:6px; }
  .sub{ text-align:center; color:var(--ink-soft); font-size:13px; margin-bottom:26px; }
  .field{ margin-bottom:14px; }
  .switch-link{ text-align:center; font-size:12.5px; color:var(--ink-soft); margin-top:18px; }
  .switch-link a{ color:var(--pink); font-weight:700; }
</style>
</head>
<body>
<svg style="position:absolute;width:0;height:0;"><defs>
  <symbol id="d-heart" viewBox="0 0 100 92"><path d="M50 88 C15 62 4 40 12 24 C19 10 40 8 50 24 C60 8 81 10 88 24 C96 40 85 62 50 88 Z"/></symbol>
</defs></svg>
<div class="ambient"><div class="blob b1"></div><div class="blob b2"></div></div>
<div class="card">
  <div class="brand"><svg viewBox="0 0 100 92" style="width:18px;height:18px;stroke:var(--pink);stroke-width:8;fill:none;"><use href="#d-heart"/></svg>Smitten</div>
  <h1>Create your account</h1>
  <p class="sub">Takes about a minute.</p>

  <div class="form-error" id="form-error"></div>
  <div class="form-note" id="form-note"></div>

  <button type="button" class="oauth-btn" id="google-btn">
    <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/><path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/><path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/><path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/></svg>
    Continue with Google
  </button>

  <div class="auth-divider">or</div>

  <form id="signup-form">
    <div class="field"><label>Full name</label><input type="text" id="full_name" placeholder="Your name" required></div>
    <div class="field"><label>Email</label><input type="email" id="email" placeholder="you@email.com" required></div>
    <div class="field"><label>Password</label><input type="password" id="password" placeholder="•••••••• (min. 6 characters)" minlength="6" required></div>
    <button class="pill-btn pink sticker-shadow-sm" type="submit" id="signup-submit" style="width:100%;margin-top:8px;">Create account →</button>
  </form>
  <div class="switch-link">Already have an account? <a href="login.html">Log in</a></div>
</div>

<script>
AUTH.redirectIfAuthed();

document.getElementById("google-btn").addEventListener("click", async (e) => {
  e.target.disabled = true;
  try {
    await AUTH.signInWithGoogle();
  } catch (err) {
    e.target.disabled = false;
    showError(err.message || "Couldn't start Google sign-in.");
  }
});

document.getElementById("signup-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const submitBtn = document.getElementById("signup-submit");
  const fullName = document.getElementById("full_name").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  hideError();
  hideNote();
  submitBtn.disabled = true;
  submitBtn.textContent = "Creating account…";
  try {
    const data = await AUTH.signUpWithEmail(email, password, fullName);
    if (data.session) {
      // Email confirmation is off for this project — go straight in.
      await AUTH.ensureUserRow(data.user);
      window.location.href = "onboarding.html";
    } else {
      // Email confirmation is required before a session is issued — send
      // them to the code-entry screen (they can also just click the link
      // in the same email; it lands on auth-callback.html).
      window.location.href = "verify-email.html?email=" + encodeURIComponent(email);
    }
  } catch (err) {
    showError(err.message || "Couldn't create your account.");
    submitBtn.disabled = false;
    submitBtn.textContent = "Create account →";
  }
});

function showError(msg) {
  const el = document.getElementById("form-error");
  el.textContent = msg;
  el.classList.add("show");
}
function hideError() {
  document.getElementById("form-error").classList.remove("show");
}
function showNote(msg) {
  const el = document.getElementById("form-note");
  el.textContent = msg;
  el.classList.add("show");
}
function hideNote() {
  document.getElementById("form-note").classList.remove("show");
}
</script>
</body>
</html>
