<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smitten — Verify your email</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Caveat:wght@500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/login.css">
<link rel="stylesheet" href="assets/css/auth-shared.css">
<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/vendor/supabase.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/auth.js"></script>
<style>
  .otp-input{
    width:100%; text-align:center; font-family:'Fredoka'; font-weight:600;
    font-size:28px; letter-spacing:.5em; padding:14px 10px 14px 16px;
  }
  .resend-row{ text-align:center; font-size:12.5px; color:var(--ink-soft); margin-top:16px; }
  .resend-row button{
    background:none; border:none; padding:0; font:inherit; font-weight:700;
    color:var(--pink); cursor:pointer;
  }
  .resend-row button:disabled{ color:var(--ink-soft); cursor:default; }
  .change-email{ text-align:center; font-size:12px; color:var(--ink-soft); margin-top:10px; }
</style>
</head>
<body>
<svg style="position:absolute;width:0;height:0;"><defs>
  <symbol id="d-heart" viewBox="0 0 100 92"><path d="M50 88 C15 62 4 40 12 24 C19 10 40 8 50 24 C60 8 81 10 88 24 C96 40 85 62 50 88 Z"/></symbol>
</defs></svg>
<div class="ambient"><div class="blob b1"></div><div class="blob b2"></div></div>
<div class="card">
  <div class="brand"><svg viewBox="0 0 100 92" style="width:18px;height:18px;stroke:var(--pink);stroke-width:8;fill:none;"><use href="#d-heart"/></svg>Smitten</div>
  <h1>Check your email</h1>
  <p class="sub" id="sub-text">Enter the 6-digit code we sent you.</p>

  <div class="form-error" id="form-error"></div>
  <div class="form-note" id="form-note"></div>

  <form id="verify-form">
    <div class="field">
      <label>Verification code</label>
      <input type="text" id="code" class="otp-input" inputmode="numeric" pattern="[0-9]*"
             maxlength="6" placeholder="······" autocomplete="one-time-code" required>
    </div>
    <button class="pill-btn pink sticker-shadow-sm" type="submit" id="verify-submit" style="width:100%;">Verify email →</button>
  </form>

  <div class="resend-row">
    Didn't get it? <button type="button" id="resend-btn">Resend code</button>
  </div>
  <div class="change-email">Wrong email? <a href="signup.html" style="color:var(--pink);font-weight:700;">Start over</a></div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const email = params.get("email") || "";

if (!email) {
  // No email to verify against — nothing useful to do here.
  window.location.href = "signup.html";
}

document.getElementById("sub-text").textContent = "We sent a 6-digit code to " + email + ".";

let resendCooldown = 0;
let resendTimer = null;
const resendBtn = document.getElementById("resend-btn");

function startResendCooldown(seconds) {
  resendCooldown = seconds;
  resendBtn.disabled = true;
  clearInterval(resendTimer);
  resendTimer = setInterval(() => {
    resendCooldown -= 1;
    if (resendCooldown <= 0) {
      clearInterval(resendTimer);
      resendBtn.disabled = false;
      resendBtn.textContent = "Resend code";
    } else {
      resendBtn.textContent = `Resend code (${resendCooldown}s)`;
    }
  }, 1000);
}
startResendCooldown(30); // matches signup — avoid hammering the send-email endpoint

resendBtn.addEventListener("click", async () => {
  hideError();
  hideNote();
  resendBtn.disabled = true;
  try {
    await AUTH.resendSignupEmail(email);
    showNote("Sent a fresh code to " + email + ".");
    startResendCooldown(30);
  } catch (err) {
    showError(err.message || "Couldn't resend the code.");
    resendBtn.disabled = false;
  }
});

document.getElementById("code").addEventListener("input", (e) => {
  e.target.value = e.target.value.replace(/[^0-9]/g, "").slice(0, 6);
});

document.getElementById("verify-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const submitBtn = document.getElementById("verify-submit");
  const code = document.getElementById("code").value.trim();
  hideError();
  hideNote();
  if (code.length !== 6) {
    showError("Enter the 6-digit code from your email.");
    return;
  }
  submitBtn.disabled = true;
  submitBtn.textContent = "Verifying…";
  try {
    const data = await AUTH.verifySignupOtp(email, code);
    await AUTH.ensureUserRow(data.user);
    const complete = await AUTH.hasProfile(data.user.id);
    window.location.href = complete ? "dashboard.html" : "onboarding.html";
  } catch (err) {
    showError(err.message || "That code didn't work — check it and try again, or resend a new one.");
    submitBtn.disabled = false;
    submitBtn.textContent = "Verify email →";
  }
});

function showError(msg) {
  const el = document.getElementById("form-error");
  el.textContent = msg;
  el.classList.add("show");
}
function hideError() {
  document.getElementById("form-error").classList.remove("show");
}
function showNote(msg) {
  const el = document.getElementById("form-note");
  el.textContent = msg;
  el.classList.add("show");
}
function hideNote() {
  document.getElementById("form-note").classList.remove("show");
}
</script>
</body>
</html>
