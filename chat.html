<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Private chat — HomeSync AI</title><link rel="stylesheet" href="css/style.css"><style>.chat-shell{display:grid;grid-template-columns:310px 1fr;min-height:620px;overflow:hidden}.chat-list{border-right:1px solid var(--line);padding:20px}.chat-list-head,.chat-header{display:flex;align-items:center;justify-content:space-between;gap:14px}.conversation-item{width:100%;display:flex;gap:12px;text-align:left;padding:12px;border:1px solid transparent;background:transparent;border-radius:14px;color:inherit;cursor:pointer;margin-top:8px}.conversation-item:hover,.conversation-item.active{background:rgba(16,185,129,.09);border-color:rgba(16,185,129,.3)}.conv-avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--panel-2,#18202b);overflow:hidden;font-weight:700}.conv-avatar img{width:100%;height:100%;object-fit:cover}.conv-copy{display:flex;flex-direction:column;gap:3px}.conv-copy small{opacity:.7}.chat-main{display:flex;flex-direction:column;min-width:0}.chat-header{padding:20px;border-bottom:1px solid var(--line)}.chat-actions{display:flex;gap:8px;flex-wrap:wrap}.message-list{flex:1;min-height:420px;max-height:560px;overflow:auto;padding:22px}.message-row{display:flex;margin:8px 0}.message-row.own{justify-content:flex-end}.message-bubble{max-width:min(70%,620px);padding:11px 14px;border-radius:18px;background:var(--panel-2,#18202b);white-space:pre-wrap;word-break:break-word}.own .message-bubble{background:#10b981;color:#04130e}.message-bubble small{display:block;font-size:10px;opacity:.65;margin-top:4px}.message-form{display:flex;gap:10px;padding:16px;border-top:1px solid var(--line)}.message-form input{flex:1}.chat-empty{display:grid;place-items:center;text-align:center;height:100%;min-height:600px;padding:30px}.chat-no-conv{padding:20px 4px}.hidden{display:none!important}.safety-warning{margin:10px 20px 0;padding:11px 13px;border-radius:12px;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);font-size:12px}.safety-warning strong{display:block;margin-bottom:3px}@media(max-width:800px){.chat-shell{grid-template-columns:1fr}.chat-list{border-right:0;border-bottom:1px solid var(--line)}.message-bubble{max-width:85%}.chat-actions .btn{padding:9px}.chat-main{min-height:600px}}</style></head><body><nav class="nav"><div class="nav-inner"><div class="brand">HomeSync AI</div><div class="nav-links"><a href="dashboard.html">Matches</a><a href="profile.html">My profile</a><a href="trust-center.html">Trust Center</a></div></div></nav><main class="wrap section-tight"><a href="dashboard.html" class="muted">← Back to matches</a><div class="chat-shell card" style="margin-top:18px"><aside class="chat-list"><div class="chat-list-head"><h3 style="margin:0">Private chats</h3><span class="pill">🔒 Accepted only</span></div><div id="conversation-list"><p class="muted">Loading…</p></div></aside><section class="chat-main"><div id="chat-empty" class="chat-empty"><div style="font-size:42px">🤝</div><h2>Choose an accepted match</h2><p class="muted">HomeSync unlocks private chat only after both people accept a merge request.</p></div><div id="chat-panel" class="hidden"><header class="chat-header"><div><h2 id="chat-name" style="margin:0"></h2><p id="chat-sub" class="muted" style="margin:4px 0 0"></p></div><div class="chat-actions"><a id="agreement-link" class="btn btn-ghost" href="#">📋 Agreement</a><a id="visit-link" class="btn btn-ghost" href="#">🛡️ Safe visit</a><button id="report-btn" class="btn btn-ghost">Report</button></div></header><div id="safety-warning" class="safety-warning hidden"><strong>⚠️ HomeSync safety check</strong><span id="safety-warning-text"></span></div><div id="message-list" class="message-list"></div><form id="message-form" class="message-form"><input id="message-input" maxlength="2000" autocomplete="off" placeholder="Write a message…"><button class="btn btn-primary">Send</button></form></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="js/supabaseClient.js"></script><script src="js/chat.js"></script></body></html>
