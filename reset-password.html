<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smitten — Set a new password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Caveat:wght@500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/login.css">
<link rel="stylesheet" href="assets/css/auth-shared.css">
<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/vendor/supabase.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/auth.js"></script>
<style>
  .otp-input{
    width:100%; text-align:center; font-family:'Fredoka'; font-weight:600;
    font-size:28px; letter-spacing:.5em; padding:14px 10px 14px 16px;
  }
  .resend-row{ text-align:center; font-size:12.5px; color:var(--ink-soft); margin-top:16px; }
  .resend-row button{
    background:none; border:none; padding:0; font:inherit; font-weight:700;
    color:var(--pink); cursor:pointer;
  }
  .resend-row button:disabled{ color:var(--ink-soft); cursor:default; }
</style>
</head>
<body>
<svg style="position:absolute;width:0;height:0;"><defs>
  <symbol id="d-heart" viewBox="0 0 100 92"><path d="M50 88 C15 62 4 40 12 24 C19 10 40 8 50 24 C60 8 81 10 88 24 C96 40 85 62 50 88 Z"/></symbol>
</defs></svg>
<div class="ambient"><div class="blob b1"></div><div class="blob b2"></div></div>
<div class="card">
  <div class="brand"><svg viewBox="0 0 100 92" style="width:18px;height:18px;stroke:var(--pink);stroke-width:8;fill:none;"><use href="#d-heart"/></svg>Smitten</div>
  <h1 id="title-text">Set a new password</h1>
  <p class="sub" id="sub-text">Make it something you'll remember.</p>

  <div class="form-error" id="form-error"></div>
  <div class="form-note" id="form-note"></div>

  <!-- Shown first if we arrived from forgot-password.html without a recovery
       session yet — i.e. the person hasn't clicked the emailed link, so we
       let them paste the 6-digit code from that same email instead. -->
  <form id="otp-form" style="display:none;">
    <div class="field">
      <label>Verification code</label>
      <input type="text" id="code" class="otp-input" inputmode="numeric" pattern="[0-9]*"
             maxlength="6" placeholder="······" autocomplete="one-time-code" required>
    </div>
    <button class="pill-btn" type="submit" id="otp-submit" style="width:100%;">Verify code →</button>
  </form>
  <div class="resend-row" id="resend-row" style="display:none;">
    Didn't get it? <button type="button" id="resend-btn">Resend</button>
  </div>

  <!-- Shown once a recovery session exists (via link click or verified code). -->
  <form id="reset-form" style="display:none;">
    <div class="field"><label>New password</label><input type="password" id="password" placeholder="•••••••• (min. 6 characters)" minlength="6" required></div>
    <div class="field"><label>Confirm password</label><input type="password" id="password2" placeholder="••••••••" minlength="6" required></div>
    <button class="pill-btn" type="submit" id="reset-submit">Update password →</button>
  </form>
  <div class="switch"><a href="login.html">Back to log in</a></div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const email = params.get("email") || "";

function showOtpForm() {
  document.getElementById("sub-text").textContent = "Enter the 6-digit code we sent to " + email + ".";
  document.getElementById("otp-form").style.display = "block";
  document.getElementById("resend-row").style.display = "block";
}
function showPasswordForm() {
  document.getElementById("sub-text").textContent = "Make it something you'll remember.";
  document.getElementById("otp-form").style.display = "none";
  document.getElementById("resend-row").style.display = "none";
  document.getElementById("reset-form").style.display = "block";
}

(async function () {
  // The recovery link puts a session in the URL (same mechanism as OAuth).
  // Give supabase-js a moment to pick it up before deciding there's no session.
  let session = await AUTH.getSession();
  for (let i = 0; i < 20 && !session; i++) {
    await new Promise((r) => setTimeout(r, 150));
    session = await AUTH.getSession();
  }
  if (session) {
    showPasswordForm();
  } else if (email) {
    // No link click detected yet, but we know who this is for — let them
    // use the 6-digit code from the same email instead.
    showOtpForm();
  } else {
    document.getElementById("sub-text").textContent = "";
    showError("This reset link is invalid or has expired. Request a new one from the login page.");
  }
})();

let resendCooldown = 0;
let resendTimer = null;
const resendBtn = document.getElementById("resend-btn");
function startResendCooldown(seconds) {
  resendCooldown = seconds;
  resendBtn.disabled = true;
  clearInterval(resendTimer);
  resendTimer = setInterval(() => {
    resendCooldown -= 1;
    if (resendCooldown <= 0) {
      clearInterval(resendTimer);
      resendBtn.disabled = false;
      resendBtn.textContent = "Resend";
    } else {
      resendBtn.textContent = `Resend (${resendCooldown}s)`;
    }
  }, 1000);
}
if (resendBtn) {
  startResendCooldown(30);
  resendBtn.addEventListener("click", async () => {
    hideError();
    hideNote();
    resendBtn.disabled = true;
    try {
      await AUTH.sendPasswordReset(email);
      showNote("Sent a fresh code to " + email + ".");
      startResendCooldown(30);
    } catch (err) {
      showError(err.message || "Couldn't resend the code.");
      resendBtn.disabled = false;
    }
  });
}

document.getElementById("code").addEventListener("input", (e) => {
  e.target.value = e.target.value.replace(/[^0-9]/g, "").slice(0, 6);
});

document.getElementById("otp-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const submitBtn = document.getElementById("otp-submit");
  const code = document.getElementById("code").value.trim();
  hideError();
  hideNote();
  if (code.length !== 6) {
    showError("Enter the 6-digit code from your email.");
    return;
  }
  submitBtn.disabled = true;
  submitBtn.textContent = "Verifying…";
  try {
    await AUTH.verifyRecoveryOtp(email, code);
    showPasswordForm();
  } catch (err) {
    showError(err.message || "That code didn't work — check it and try again, or resend a new one.");
    submitBtn.disabled = false;
    submitBtn.textContent = "Verify code →";
  }
});

document.getElementById("reset-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const submitBtn = document.getElementById("reset-submit");
  const password = document.getElementById("password").value;
  const password2 = document.getElementById("password2").value;
  hideError();
  hideNote();
  if (password !== password2) {
    showError("Passwords don't match.");
    return;
  }
  submitBtn.disabled = true;
  submitBtn.textContent = "Updating…";
  try {
    await AUTH.updatePassword(password);
    showNote("Password updated! Taking you to your dashboard…");
    setTimeout(() => { window.location.href = "dashboard.html"; }, 1200);
  } catch (err) {
    showError(err.message || "Couldn't update your password.");
    submitBtn.disabled = false;
    submitBtn.textContent = "Update password →";
  }
});
function showError(msg){ const el=document.getElementById("form-error"); el.textContent=msg; el.classList.add("show"); }
function hideError(){ document.getElementById("form-error").classList.remove("show"); }
function showNote(msg){ const el=document.getElementById("form-note"); el.textContent=msg; el.classList.add("show"); }
function hideNote(){ document.getElementById("form-note").classList.remove("show"); }
</script>
</body>
</html>
