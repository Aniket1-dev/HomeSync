<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Roommate profile — HomeSync AI</title>
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/light-dashboard.css">
<style>
.public-profile{max-width:980px;margin:42px auto;padding-bottom:50px}.profile-hero{display:grid;grid-template-columns:110px 1fr auto;gap:22px;align-items:center}.public-avatar{width:110px;height:110px;border-radius:30px;background:var(--sage,#8ba98d);display:grid;place-items:center;font-size:32px;font-weight:800;background-size:cover;background-position:center;box-shadow:0 18px 45px rgba(0,0,0,.16)}.profile-badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.pill{padding:7px 11px;border:1px solid var(--line);border-radius:999px;font-size:13px;background:rgba(255,255,255,.04)}.profile-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:20px}.info-card{padding:22px}.info-card h4{margin:0 0 9px}.privacy{padding:14px 16px;border-radius:14px;background:rgba(120,170,130,.12);border:1px solid var(--line);margin-top:20px}.back{display:inline-block;margin-bottom:18px;color:#10b981;text-decoration:none}.verify-count{font-size:24px;font-weight:800;margin-bottom:10px}.profile-lifestyle-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:15px}.lifestyle-item{display:flex;gap:10px;align-items:center;padding:13px;border:1px solid var(--line);border-radius:14px;background:rgba(127,127,127,.035)}.lifestyle-item>span{font-size:22px}.lifestyle-item small{display:block;opacity:.65;margin-bottom:3px}.lifestyle-item strong{display:block}.empty-posts{text-align:center;padding:28px;border:1px dashed var(--line);border-radius:16px}.empty-posts span{font-size:28px}.profile-post{padding:16px 0;border-bottom:1px solid var(--line)}.profile-post:last-child{border-bottom:0}.post-meta{display:flex;justify-content:space-between;gap:12px;font-size:12px;opacity:.7}.profile-post p{margin:10px 0 0;white-space:pre-wrap}.profile-post img{width:100%;max-height:420px;object-fit:cover;border-radius:14px;margin-top:12px}.top-vibe-match{border:1px solid rgba(16,185,129,.7);box-shadow:0 18px 50px rgba(16,185,129,.10)}.best-vibe-badge{display:inline-flex;padding:5px 9px;border-radius:999px;background:rgba(16,185,129,.12);color:#10b981;font-size:12px;font-weight:800;margin-bottom:9px}
@media(max-width:700px){.profile-hero{grid-template-columns:78px 1fr}.public-avatar{width:78px;height:78px;border-radius:20px}.profile-hero .profile-action{grid-column:1/-1}.profile-grid{grid-template-columns:1fr}.profile-lifestyle-grid{grid-template-columns:1fr}}
</style></head>
<body>
<nav class="nav"><div class="nav-inner"><div class="brand"><img src="assets/logo-transparent.png" class="brand-mark" style="background:none"> HomeSync AI</div><div class="nav-links"><a href="dashboard.html">Matches</a><a href="profile.html">My account</a></div></div></nav>
<main class="wrap public-profile"><a class="back" href="dashboard.html">← Back to matches</a><div id="profile-root"><div class="card"><p>Loading profile…</p></div></div></main>

</body></html>
