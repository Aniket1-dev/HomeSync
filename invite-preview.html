<!DOCTYPE html>
<html lang="en">
<head>
<style id="auth-gate">html{visibility:hidden}</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smitten — Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Caveat:wght@500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/invite-preview.css">
<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/vendor/supabase.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/ui-helpers.js"></script>
<script src="assets/js/api.js"></script>
</head>
<body>
<script>AUTH.requireAuth();</script>
<svg style="position:absolute;width:0;height:0;"><defs>
  <symbol id="d-heart" viewBox="0 0 100 92"><path d="M50 88 C15 62 4 40 12 24 C19 10 40 8 50 24 C60 8 81 10 88 24 C96 40 85 62 50 88 Z"/></symbol>
</defs></svg>
<div class="banner" id="preview-banner">
  <span id="banner-text">👀 Loading preview…</span>
  <div style="display:flex;gap:10px;" id="banner-actions"></div>
</div>
<div class="stage">
  <div class="phone">
    <div class="screen" id="preview-screen">
      <svg viewBox="0 0 100 92" style="width:44px;height:44px;stroke:var(--pink);stroke-width:5;fill:none;margin-bottom:22px;"><use href="#d-heart"/></svg>
      <div class="eyebrow">Loading…</div>
    </div>
  </div>
</div>
<script>
function qs(name) { return new URLSearchParams(window.location.search).get(name); }

async function load() {
  const id = qs("id");
  const bannerText = document.getElementById("banner-text");
  const actions = document.getElementById("banner-actions");
  const screen = document.getElementById("preview-screen");
  if (!id) { bannerText.textContent = "No note specified."; return; }
  try {
    const inv = await API.getMyInvitation(id);
    if (!inv) { bannerText.textContent = "That note doesn't exist or isn't yours."; return; }

    const isDraft = inv.status === "draft";
    bannerText.textContent = isDraft
      ? "👀 Previewing as your recipient would see it — nothing here is sent yet."
      : `👀 Previewing — this note is currently "${inv.status}".`;

    actions.innerHTML = `<a href="studio.html?id=${inv.id}" class="pill-btn">← Back to Studio</a>` +
      (isDraft ? `<button class="pill-btn pink" id="publish-btn">Looks good, publish</button>` :
        `<button class="pill-btn pink" id="copy-link-btn">Copy invite link</button>`);

    const dateStr = inv.scheduled_date ? new Date(inv.scheduled_date).toLocaleDateString(undefined, { day: "2-digit", month: "2-digit", year: "2-digit" }).replace(/\//g, " · ") : "";
    screen.innerHTML = `
      <svg viewBox="0 0 100 92" style="width:44px;height:44px;stroke:var(--pink);stroke-width:5;fill:none;margin-bottom:22px;"><use href="#d-heart"/></svg>
      ${dateStr ? `<div class="eyebrow">${dateStr}</div>` : ""}
      <h1>A private note,<br>just for you.</h1>
      <p class="for">for ${UI.esc(inv.recipient_name || "someone special")} 💌</p>`;

    if (isDraft) {
      document.getElementById("publish-btn").addEventListener("click", async (e) => {
        if (!inv.recipient_name) { UI.toast("Add a recipient name in the Studio first.", "error"); return; }
        e.target.textContent = "Publishing…";
        e.target.disabled = true;
        try {
          const published = await API.publishInvitation(inv.id);
          const link = API.inviteUrl(published.public_token);
          try { await navigator.clipboard.writeText(link); } catch (_) {}
          alert(`Published! 🎉\n\nYour private link (copied to clipboard):\n${link}`);
          window.location.href = "invitations.html";
        } catch (err) {
          UI.toast(UI.friendlyError(err), "error");
          e.target.textContent = "Looks good, publish";
          e.target.disabled = false;
        }
      });
    } else {
      document.getElementById("copy-link-btn").addEventListener("click", async (e) => {
        const link = API.inviteUrl(inv.public_token);
        try { await navigator.clipboard.writeText(link); UI.toast("Link copied!", "success"); }
        catch (_) { prompt("Copy this link:", link); }
      });
    }
  } catch (err) {
    bannerText.textContent = UI.friendlyError(err);
  }
}
load();
</script>
</body>
</html>
