<main>

  <header class="top">
    <h1>✦ Users</h1>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="#7A6B78" stroke-width="2"/><path d="M21 21l-4-4" stroke="#7A6B78" stroke-width="2" stroke-linecap="round"/></svg>
      <input placeholder="Search users, notes, orders...">
    </div>
    <div class="topright">
      <div class="avatar"></div>
    </div>
  </header>

  <div class="panel">
    <div class="panel-head">
      <h3>All users</h3>
      <div class="tabs" id="user-tabs">
        <div class="tab active" data-filter="all">All</div>
        <div class="tab" data-filter="admins">Admins</div>
        <div class="tab" data-filter="suspended">Suspended</div>
        <div class="tab" data-filter="blocked">Blocked</div>
      </div>
    </div>
    <table>
      <thead><tr><th>User</th><th>Role</th><th>Status</th><th>Joined</th><th>Actions</th></tr></thead>
      <tbody id="users-tbody">
        <tr><td colspan="5" style="text-align:center;padding:36px;color:var(--ink-soft);">⏳ Loading…</td></tr>
      </tbody>
    </table>
    <div class="panel-foot">
      <span id="users-count"></span>
      <div style="display:flex;gap:8px;"><button class="pill-btn" id="prev-btn">Prev</button><button class="pill-btn" id="next-btn">Next</button></div>
    </div>
  </div>

</main>
<script>
const PAGE_SIZE = 20;
let page = 0;
let filter = "all";
let searchTerm = "";

function statusTag(status) {
  if (status === "active") return `<span class="tag active">active</span>`;
  if (status === "suspended") return `<span class="tag suspended">suspended</span>`;
  return `<span class="tag pending">${UI.esc(status)}</span>`;
}

async function loadUsers() {
  const tbody = document.getElementById("users-tbody");
  tbody.innerHTML = UI.loadingRow(5);
  try {
    const { rows, count } = await API.admin.listUsers({ search: searchTerm, page, pageSize: PAGE_SIZE });
    let filtered = rows;
    if (filter === "admins") filtered = rows.filter((u) => u.admin_users && u.admin_users.length);
    if (filter === "suspended") filtered = rows.filter((u) => u.status === "suspended");
    if (filter === "blocked") filtered = rows.filter((u) => u.status === "blocked");

    if (!filtered.length) { tbody.innerHTML = UI.emptyRow(5, "No users match this view."); }
    else {
      tbody.innerHTML = filtered.map((u) => {
        const name = u.profiles?.full_name || u.profiles?.display_name || u.email;
        const role = u.admin_users && u.admin_users[0] ? u.admin_users[0].role.replace("_", " ") : "member";
        const roleTag = u.admin_users && u.admin_users.length ? `<span class="tag admin">${UI.esc(role)}</span>` : `<span class="tag active">member</span>`;
        return `<tr data-id="${u.id}">
          <td><div class="userpill"><div class="mini-avatar" style="background:linear-gradient(135deg,var(--pink),var(--yellow));">${UI.esc(UI.initials(name))}</div><div><div class="name">${UI.esc(name)}</div><div class="sub-text">${UI.esc(u.email)}</div></div></div></td>
          <td>${roleTag}</td>
          <td>${statusTag(u.status)}</td>
          <td>${UI.fmtDate(u.created_at)}</td>
          <td class="row-actions">
            <button class="pill-btn ghost sm" data-action="role" data-id="${u.id}" data-current="${u.admin_users?.[0]?.role || ""}">Role</button>
            <button class="pill-btn ghost sm" data-action="${u.status === "suspended" ? "activate" : "suspend"}" data-id="${u.id}">${u.status === "suspended" ? "Unsuspend" : "Suspend"}</button>
            <button class="icon-btn danger" data-action="delete" data-id="${u.id}" title="Delete user"><svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13" stroke="#E15B4E" stroke-width="2" stroke-linecap="round"/></svg></button>
          </td>
        </tr>`;
      }).join("");
    }
    document.getElementById("users-count").textContent = `Showing ${filtered.length} of ${count} users`;
    document.getElementById("prev-btn").disabled = page === 0;
    document.getElementById("next-btn").disabled = (page + 1) * PAGE_SIZE >= count;
  } catch (err) {
    tbody.innerHTML = UI.errorRow(5, UI.friendlyError(err));
  }
}

document.getElementById("users-tbody").addEventListener("click", async (e) => {
  const btn = e.target.closest("[data-action]");
  if (!btn) return;
  const id = btn.dataset.id;
  const action = btn.dataset.action;
  try {
    if (action === "suspend") { await API.admin.setUserStatus(id, "suspended"); UI.toast("User suspended", "success"); }
    else if (action === "activate") { await API.admin.setUserStatus(id, "active"); UI.toast("User reactivated", "success"); }
    else if (action === "delete") {
      if (!confirm("Permanently delete this user and all their data?")) return;
      await API.admin.deleteUser(id);
      UI.toast("User deleted", "success");
    } else if (action === "role") {
      const roles = ["(none — remove admin)", "super_admin", "content_admin", "support_admin", "finance_admin", "moderator"];
      const choice = prompt(`Set role — one of:\n${roles.join(", ")}`, btn.dataset.current || "");
      if (choice === null) return;
      const role = roles.includes(choice) && choice !== "(none — remove admin)" ? choice : (choice.trim() === "" ? null : choice.trim());
      await API.admin.setUserRole(id, role || null);
      UI.toast("Role updated", "success");
    }
    loadUsers();
  } catch (err) {
    UI.toast(UI.friendlyError(err), "error");
  }
});

document.getElementById("user-tabs").addEventListener("click", (e) => {
  const tab = e.target.closest(".tab");
  if (!tab) return;
  document.querySelectorAll("#user-tabs .tab").forEach((t) => t.classList.remove("active"));
  tab.classList.add("active");
  filter = tab.dataset.filter;
  page = 0;
  loadUsers();
});
document.querySelector(".search input").addEventListener("input", (e) => {
  searchTerm = e.target.value.trim();
  page = 0;
  clearTimeout(window.__searchTimer);
  window.__searchTimer = setTimeout(loadUsers, 300);
});
document.getElementById("prev-btn").addEventListener("click", () => { if (page > 0) { page--; loadUsers(); } });
document.getElementById("next-btn").addEventListener("click", () => { page++; loadUsers(); });

loadUsers();
</script>
</body>
